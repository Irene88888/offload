<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>磅單追蹤平台 - 紀錄列表</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topnav">
  <div class="brand">🐟 磅單追蹤平台</div>
  <a href="/index.html" class="active">紀錄列表</a>
  <a href="/new.html">新增紀錄</a>
  <a href="/stats.html">統計摘要</a>
</header>

<main>
  <div class="card">
    <div class="toolbar">
      <select id="f-location"><option value="">卸魚地點（全部）</option></select>
      <select id="f-pricing"><option value="">是否收到計價單（全部）</option></select>
      <select id="f-payment"><option value="">付款狀態（全部）</option></select>
      <input id="f-date-from" type="date" title="卸魚日期起">
      <input id="f-date-to" type="date" title="卸魚日期迄">
      <input id="f-q" type="text" placeholder="搜尋 魚貨主/船名/備註/車號/傳票編號">
      <button id="btn-filter">篩選</button>
      <button id="btn-clear" class="secondary">清除</button>
    </div>
    <div class="toolbar">
      <a class="btn" href="/api/export.xlsx">匯出 Excel</a>
      <label class="btn secondary" style="margin:0;">
        匯入 Excel（原舊版磅單追蹤表）
        <input id="import-file" type="file" accept=".xlsx,.xlsm" style="display:none;">
      </label>
      <span class="hint" id="count-hint"></span>
    </div>
  </div>

  <div class="card table-scroll">
    <table id="records-table">
      <thead>
        <tr>
          <th>卸魚地點</th><th>卸魚日期</th><th>魚貨主/船名</th><th>傳票編號</th><th>車號</th>
          <th>淨重(KG)</th><th class="notes-cell">備註(魚種/數量)</th>
          <th>計價單</th><th>付款狀態</th>
          <th>計價金額</th><th>切結淨額</th><th>付款排程</th><th>實際付款日</th>
          <th>照片</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="records-body"><tr><td colspan="15">載入中…</td></tr></tbody>
    </table>
  </div>
</main>

<dialog id="edit-dialog" style="border:none;border-radius:10px;padding:0;width:min(640px,94vw);">
  <form method="dialog" class="card" id="edit-form" style="margin:0;">
    <h3>編輯紀錄</h3>
    <div class="grid cols-2" id="edit-fields"></div>
    <div class="toolbar" style="margin-top:12px;">
      <button type="submit" id="edit-save">儲存</button>
      <button type="button" id="edit-cancel" class="secondary">取消</button>
    </div>
  </form>
</dialog>

<script src="/js/api.js"></script>
<script src="/js/list.js"></script>
</body>
</html>
