<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>磅單追蹤平台 - 新增紀錄</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topnav">
  <div class="brand">🐟 磅單追蹤平台</div>
  <a href="/index.html">紀錄列表</a>
  <a href="/new.html" class="active">新增紀錄</a>
  <a href="/stats.html">統計摘要</a>
</header>

<main>
  <div class="card">
    <h2>1. 上傳磅單照片（選填）</h2>
    <p class="hint">上傳後會用本機 OCR 嘗試辨識文字並猜測欄位（標示為黃色底），僅供參考，請務必核對後再送出。不上傳照片也可以直接手動填寫下方表單。</p>
    <div id="drop-zone" class="upload-drop">
      點此選擇照片，或將照片拖曳到這裡
      <input id="file-input" type="file" accept="image/*" capture="environment" style="display:none;">
    </div>
    <img id="preview-img" class="preview-img" style="display:none;">
    <div id="ocr-status" class="hint"></div>
    <details id="ocr-details" style="display:none;">
      <summary>OCR 原始辨識文字（除錯用）</summary>
      <div id="ocr-raw" class="ocr-box"></div>
    </details>
  </div>

  <form id="record-form" class="card">
    <h2>2. 確認 / 填寫欄位</h2>
    <div class="grid cols-2">
      <div class="field">
        <label>卸魚地點 *</label>
        <select name="location" required></select>
      </div>
      <div class="field">
        <label>卸魚日期</label>
        <input type="date" name="unload_date">
      </div>
      <div class="field">
        <label>傳票編號/序號</label>
        <input type="text" name="slip_no">
      </div>
      <div class="field">
        <label>車號</label>
        <input type="text" name="vehicle_no">
      </div>
      <div class="field">
        <label>魚貨主/船名</label>
        <input type="text" name="owner_boat">
      </div>
      <div class="field">
        <label>總重(KG)</label>
        <input type="number" step="0.01" name="gross_weight">
      </div>
      <div class="field">
        <label>空重(KG)</label>
        <input type="number" step="0.01" name="tare_weight">
      </div>
      <div class="field">
        <label>淨重(KG)</label>
        <input type="number" step="0.01" name="net_weight">
      </div>
    </div>
    <div class="field">
      <label>備註(魚種/數量)</label>
      <textarea name="notes" rows="2"></textarea>
    </div>
    <div class="grid cols-3">
      <div class="field">
        <label>是否收到計價單</label>
        <select name="pricing_slip_received"></select>
      </div>
      <div class="field">
        <label>計價單收到日期</label>
        <input type="date" name="pricing_slip_date">
      </div>
      <div class="field">
        <label>付款排程(卸魚+14天)</label>
        <input type="date" name="payment_schedule">
      </div>
    </div>
    <div class="grid cols-3">
      <div class="field">
        <label>計價金額(未稅,元)</label>
        <input type="number" step="1" name="price_amount">
      </div>
      <div class="field">
        <label>切結轉帳淨額(元)</label>
        <input type="number" step="1" name="net_transfer_amount">
      </div>
      <div class="field">
        <label>付款狀態</label>
        <select name="payment_status"></select>
      </div>
    </div>
    <div class="field">
      <label>實際付款日</label>
      <input type="date" name="actual_payment_date" style="max-width:220px;">
    </div>
    <div class="field">
      <label><input type="checkbox" name="included_in_stats" checked style="width:auto;"> 計入統計加總（若此筆金額已併入同船其他列彙總，請取消勾選）</label>
    </div>
    <div class="toolbar">
      <button type="submit">儲存紀錄</button>
      <button type="button" id="btn-reset" class="secondary">清空表單</button>
    </div>
  </form>
</main>

<script src="/js/api.js"></script>
<script src="/js/new.js"></script>
</body>
</html>
